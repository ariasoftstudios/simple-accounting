name: Deploy Simple Accounting Portfolio

on:
    push:
        branches:
            - main
        paths:
            - "desktop/**"
            - ".github/workflows/simple-accounting-pages.yml"
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: simple-accounting-pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: desktop

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: desktop/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Build portfolio app
              run: npm run build

            - name: Setup Pages
              uses: actions/configure-pages@v5

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: desktop/dist/simple-accounting/browser

    deploy:
        needs: build
        runs-on: ubuntu-latest

        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
