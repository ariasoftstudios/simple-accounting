    height="32"
    viewBox="0 0 300 300"
    xmlns="http://www.w3.org/2000/svg"
    class="h-8 w-8"
  >
    <rect x="20" y="20" width="260" height="260" rx="50" fill="#0A84FF" />
    <rect x="90" y="170" width="30" height="60" rx="5" fill="black" />
    <rect x="135" y="145" width="30" height="85" rx="5" fill="black" />
    <rect x="180" y="120" width="30" height="110" rx="5" fill="black" />
    <path
      d="M165 75 L200 110 L245 60"
      stroke="black"
      stroke-width="16"
      fill="none"
      stroke-linecap="round"

</div>
