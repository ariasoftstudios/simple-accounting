<header class="bg-white shadow-sm border-b border-gray-200">
  <!-- Top Row: Logo, Page Name, Search, User Info, Hamburger -->
  <div class="px-6 py-4 flex items-center justify-between">
    <!-- Left Section: Logo & Page Name -->
    <div class="flex items-center space-x-4">
      <!-- Logo -->
      <app-logo ></app-logo>

      <!-- Current Page Name -->
      @if (currentPageName) {
        <div class="hidden md:block">
          <h1 class="text-xl font-semibold text-gray-900">{{ currentPageName }}</h1>
        </div>
      }
    </div>

    <!-- Center: Search Bar -->
    <div class="hidden md:flex flex-1 max-w-md mx-8">
      <div class="relative w-full">
        <input
          type="text"
          placeholder="Search invoices, clients, reports..."
          class="w-full px-4 py-2 pl-10 pr-4 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        />
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center">
          <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            ></path>
          </svg>
        </div>
      </div>
    </div>

    <!-- Right Section: User Info & Hamburger -->
    <div class="flex items-center space-x-4">
      <!-- User Information -->
      <div class="hidden lg:flex items-center space-x-3">
        <div class="w-8 h-8 bg-gray-300 rounded-full flex items-center justify-center">
          <span class="text-sm font-medium text-gray-700">{{ userInitials }}</span>
        </div>
        <div class="text-sm">
          <div class="font-medium text-gray-900">{{ userName }}</div>
          <div class="text-gray-500">{{ userRole }}</div>
        </div>
      </div>
      <app-hamburger-menu></app-hamburger-menu>
      <!-- Hamburger Menu -->
      <!-- <p-button label="Meny" [rounded]="true" icon="pi pi-bars" [text]="true" /> -->
    </div>
  </div>
</header>
