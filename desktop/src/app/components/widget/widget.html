<div class="mb-4 p-8">
  <p-card class="h-full">
    <div>
      <div class="flex items-start gap-4 mb-4">
        <div class="flex items-center justify-between mb-4">
          <i [class]="icon + ' text-2xl ' + iconColor"></i>
        </div>
        <h3 class="text-xl font-semibold text-blue-500">
          {{ title }}
        </h3>
      </div>
    </div>
    <div class="flex items-center justify-between mb-4">
      <p class="text-gray-600">
        {{ description }}
      </p>
    </div>
  </p-card>
</div>
