<div class="p-6">
  <div class="mb-6">
    <h1 class="text-3xl font-bold text-gray-900 mb-2">Dashboard</h1>
    <p class="text-gray-600">Översikt över din ekonomi</p>
  </div>

  <app-widgets-wrapper>
    @for (widget of widgets(); track widget.title) {
      <app-widget
        [title]="widget.title"
        [description]="widget.description"
        [icon]="widget.icon"
      ></app-widget>
    } @empty {
      <div>Det var tomt här..</div>
    }
  </app-widgets-wrapper>
</div>
